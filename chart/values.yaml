namespace: watcher

# Public hostname for the UI + OTLP ingest, exposed via Traefik.
hostname: "watcher.example.com"

imagePullSecrets:
  - name: github

server:
  replicaCount: 1
  # Delete telemetry older than this many days (0 disables).
  retentionDays: 7
  # Optional bearer tokens. Empty = that surface is open (rely on edge auth such
  # as Cloudflare Access). When set, the chart creates a `watcher-tokens` Secret
  # and wires the env. Supply via a SOPS-encrypted helmfile secrets file — do NOT
  # commit plaintext. Note: setting ingestToken means in-cluster senders
  # (whisperer) must present it too (OTEL_EXPORTER_OTLP_HEADERS).
  apiToken: ""
  ingestToken: ""
  image:
    repository: ghcr.io/thejefflarson/watcher-server
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# A dedicated Postgres provisioned by the Zalando postgres-operator.
# The operator creates a credential secret:
#   {user}.{clusterName}.credentials.postgresql.acid.zalan.do
postgres:
  teamId: watcher
  clusterName: watcher-db
  version: "17"
  numberOfInstances: 1
  user: watcher
  database: watcher
  volume:
    size: 10Gi
    storageClass: local-path

ingressRoute:
  enabled: true
  # When false (default), OTLP ingest (/v1) is NOT routed on the public host —
  # telemetry is pushed in-cluster via the Service, so there's no public write
  # surface. Enable only behind edge auth (e.g. a Cloudflare Access service token).
  exposeIngest: false
