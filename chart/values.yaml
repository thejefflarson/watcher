namespace: watcher

# Public hostname for the UI + OTLP ingest, exposed via Traefik.
hostname: "watcher.example.com"

imagePullSecrets:
  - name: github

server:
  replicaCount: 1
  # Delete telemetry older than this many days (0 disables). Set auth tokens via
  # WATCHER_INGEST_TOKEN / WATCHER_API_TOKEN env if you need them.
  retentionDays: 7
  image:
    repository: ghcr.io/thejefflarson/watcher-server
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ui:
  replicaCount: 1
  image:
    repository: ghcr.io/thejefflarson/watcher-ui
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

# A dedicated Postgres provisioned by the Zalando postgres-operator.
# The operator creates a credential secret:
#   {user}.{clusterName}.credentials.postgresql.acid.zalan.do
postgres:
  teamId: watcher
  clusterName: watcher-db
  version: "17"
  numberOfInstances: 1
  user: watcher
  database: watcher
  volume:
    size: 10Gi
    storageClass: local-path

ingressRoute:
  enabled: true
