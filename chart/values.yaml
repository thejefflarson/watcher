namespace: watcher

# Public hostname for the UI + OTLP ingest, exposed via Traefik.
hostname: "watcher.example.com"

imagePullSecrets:
  - name: github

server:
  replicaCount: 1
  # Delete telemetry older than this many days (0 disables).
  retentionDays: 7
  image:
    repository: ghcr.io/thejefflarson/watcher-server
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# A dedicated Postgres provisioned by the Zalando postgres-operator.
# The operator creates a credential secret:
#   {user}.{clusterName}.credentials.postgresql.acid.zalan.do
postgres:
  teamId: watcher
  clusterName: watcher-db
  version: "17"
  # 2 instances for HA: a node loss/cordon fails over to the replica instead of
  # taking the DB down (a single local-path instance was stranded for ~2 days
  # when its node was cordoned). On nfs-client so pods reschedule to any node.
  numberOfInstances: 2
  user: watcher
  database: watcher
  volume:
    size: 10Gi
    storageClass: nfs-client
  # Per-instance resources for the Postgres container. The operator default
  # (~500Mi) OOM-kills the DB under sustained ingest, so give it real headroom.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingressRoute:
  enabled: true
  # When false (default), OTLP ingest (/v1) is NOT routed on the public host —
  # telemetry is pushed in-cluster via the Service, so there's no public write
  # surface. Enable only behind edge auth (e.g. a Cloudflare Access service token).
  exposeIngest: false
