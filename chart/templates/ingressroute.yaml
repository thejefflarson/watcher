{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: watcher-security-headers
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "strict-origin-when-cross-origin"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: watcher
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    # The server handles the query API (/api), health (/healthz), and the embedded
    # SPA (everything else). OTLP ingest (/v1) is deliberately NOT exposed on the
    # public host by default — telemetry is pushed in-cluster via the Service, so
    # there's no anonymous-write surface. Carved out with Traefik v3's `!` matcher,
    # so /v1 simply isn't routed (404 at the edge). Flip exposeIngest=true only
    # behind edge auth (e.g. a Cloudflare Access service token on /v1).
    - match: >-
        Host(`{{ .Values.hostname }}`){{ if not .Values.ingressRoute.exposeIngest }} && !PathPrefix(`/v1`){{ end }}
      kind: Rule
      middlewares:
        - name: watcher-security-headers
      services:
        - name: watcher-server
          port: 4318
{{- end }}
