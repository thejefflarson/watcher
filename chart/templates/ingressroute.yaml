{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: watcher-security-headers
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "strict-origin-when-cross-origin"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: watcher
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    # One backend: the server handles OTLP ingest (/v1), the query API (/api),
    # health (/healthz), and serves the embedded SPA for everything else.
    - match: Host(`{{ .Values.hostname }}`)
      kind: Rule
      middlewares:
        - name: watcher-security-headers
      services:
        - name: watcher-server
          port: 4318
{{- end }}
