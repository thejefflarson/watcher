{{- if or .Values.server.apiToken .Values.server.ingestToken }}
# Bearer tokens for /api and/or /v1. Populated from chart values — supply them
# via a SOPS-encrypted helmfile secrets file rather than plaintext values.
apiVersion: v1
kind: Secret
metadata:
  name: watcher-tokens
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.server.apiToken }}
  api-token: {{ .Values.server.apiToken | quote }}
  {{- end }}
  {{- if .Values.server.ingestToken }}
  ingest-token: {{ .Values.server.ingestToken | quote }}
  {{- end }}
{{- end }}
