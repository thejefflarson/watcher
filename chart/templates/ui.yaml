apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app: watcher-ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: watcher-ui
  template:
    metadata:
      labels:
        app: watcher-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx-unprivileged
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx needs writable /tmp + cache dirs
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: watcher-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app: watcher-ui
spec:
  type: ClusterIP
  selector:
    app: watcher-ui
  ports:
    - port: 80
      targetPort: 8080
