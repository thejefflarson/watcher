# Dependabot version updates. The OTLP stack is coupled — the opentelemetry
# crates (opentelemetry / _sdk / -otlp / -proto), tracing-opentelemetry, and the
# gRPC codegen runtime (tonic + prost that opentelemetry-proto's generated
# services build against) must move together, or you get an incompatible split
# that fails to compile. Group them so dependabot proposes the whole set in one PR
# (which the required CI checks then gate) instead of piecemeal bumps.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    groups:
      otlp-stack:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
          - "tonic"
          - "prost"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
