# Dependabot version updates. Held here: the OTLP stack must move as a set.
# The opentelemetry crates (opentelemetry / _sdk / -otlp / -proto) +
# tracing-opentelemetry share coupled APIs; tonic + prost are the gRPC codegen
# runtime that opentelemetry-proto's generated services (TraceServiceServer, …)
# are built against, so their versions must match opentelemetry-proto's. A lone
# bump — opentelemetry_sdk 0.27->0.32 (#67/#71) or tonic 0.12->0.14 — leaves an
# incompatible split that fails to compile. Ignore the whole stack until someone
# does the coordinated migration in one PR (bump all of them + update the SDK init
# in main.rs, the proto types in otlp.rs, and the gRPC server in grpc.rs), then
# drop these ignores.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "opentelemetry*"
      - dependency-name: "tracing-opentelemetry"
      - dependency-name: "tonic"
      - dependency-name: "prost"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
