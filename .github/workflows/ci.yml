name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: watcher
          POSTGRES_PASSWORD: watcher
          POSTGRES_DB: watcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watcher"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://watcher:watcher@localhost:5432/watcher
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked   # runs the ingest->query integration test against the service DB

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run: helm lint chart

  # One image now: the server builds the UI and embeds it (rust-embed), so there
  # is no separate watcher-ui image. Build context is the repo root.
  #
  # Native arm64 on the self-hosted runner (watcher-runners), offloading to the
  # in-cluster BuildKit — no QEMU, since the cluster is ARM-only. BuildKit enforces
  # mTLS, so we point the remote driver at the client cert the runner already
  # mounts (BUILDKIT_TLS_DIR) and verify against its servername; without the cert
  # the gRPC handshake is rejected. BuildKit's daemon cache replaces the gha cache.
  image:
    needs: [server, ui, chart]
    if: github.ref == 'refs/heads/main'
    runs-on: watcher-runners
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC token -> Sigstore Fulcio)
    steps:
      - uses: actions/checkout@v6
      - name: Connect to BuildKit (mTLS)
        run: |
          for i in 1 2 3 4 5; do
            docker buildx rm watcher-remote >/dev/null 2>&1 || true
            if docker buildx create --name watcher-remote --use \
                 --driver remote \
                 --driver-opt cacert="$BUILDKIT_TLS_DIR/ca.crt",cert="$BUILDKIT_TLS_DIR/tls.crt",key="$BUILDKIT_TLS_DIR/tls.key",servername="$BUILDKIT_TLS_SERVER_NAME" \
                 "$BUILDKIT_HOST" \
               && timeout 90 docker buildx inspect --bootstrap; then
              echo "connected to buildkit"; exit 0
            fi
            echo "buildkit connect failed (attempt $i/5), retrying…"; sleep 10
          done
          echo "could not reach buildkit"; exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/watcher-server
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        # Sign by immutable digest, not tag. Keyless: GitHub's OIDC token is
        # exchanged for a short-lived Fulcio cert and the signature is recorded in
        # the Rekor transparency log — no private key to store. cosign reuses the
        # docker login above to push the signature to GHCR.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/watcher-server@${DIGEST}"
