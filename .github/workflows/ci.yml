name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: watcher
          POSTGRES_PASSWORD: watcher
          POSTGRES_DB: watcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watcher"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://watcher:watcher@localhost:5432/watcher
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked   # runs the ingest->query integration test against the service DB

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run: helm lint chart

  # One image now: the server builds the UI and embeds it (rust-embed), so there
  # is no separate watcher-ui image. Build context is the repo root.
  #
  # Native arm64 on the self-hosted runner (watcher-runners), offloading to the
  # in-cluster BuildKit — no QEMU. watcher-runners is pinned to cluster-main (the
  # only node that can currently reach the BuildKit Service); the retry rides out
  # any per-connection routing to a cross-node endpoint. BuildKit's daemon cache
  # replaces the gha cache.
  image:
    needs: [server, ui, chart]
    if: github.ref == 'refs/heads/main'
    runs-on: watcher-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Connect to BuildKit (retry)
        run: |
          for i in $(seq 1 10); do
            docker buildx rm watcher-remote >/dev/null 2>&1 || true
            if docker buildx create --name watcher-remote --use \
                 --driver remote tcp://buildkit.dev.svc.cluster.local:1234 \
               && timeout 90 docker buildx inspect --bootstrap; then
              echo "connected to buildkit"; exit 0
            fi
            echo "buildkit unreachable (attempt $i/10), retrying…"; sleep 25
          done
          echo "could not reach buildkit"; exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/watcher-server
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
