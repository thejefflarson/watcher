[package]
name = "watcher-server"
version = "0.1.0"
edition = "2021"
description = "Postgres-native OTLP traces + logs ingest and query backend"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
    "migrate",
] }
prost = "0.13"
tonic = "0.12"
opentelemetry-proto = { version = "0.27", default-features = false, features = [
    "gen-tonic",
    "trace",
    "logs",
    "metrics",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.11.0", features = ["mime-guess"] }
mime_guess = "2.0.5"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "3.5.0"
