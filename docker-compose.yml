# Local dev Postgres for watcher. (Plain Postgres; swap for timescale/timescaledb
# if you want hypertables.) The server auto-runs migrations on startup.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
      POSTGRES_DB: watcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
